<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://njhitz.org/player-profile"><title>Player profile | NJ Hitz</title></head><body>
<p>This player profile has moved. <a id="profile-redirect" href="player-profile">Continue to the player profile</a>.</p>
<script>
(function(){
  const target=new URL('player-profile',window.location.href);
  target.search=window.location.search;
  target.hash=window.location.hash;
  document.getElementById('profile-redirect').href=target.href;
  window.location.replace(target.href);
})();
</script></body></html>
