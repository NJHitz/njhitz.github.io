<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Video optimization check | NJ Hitz</title><style>body{font:16px system-ui;background:#100d17;color:#fff;max-width:850px;margin:40px auto;padding:20px}button,input{font:inherit;padding:12px;margin:8px 0}button{background:#ddbc69;border:0;border-radius:8px}video{width:100%;max-height:500px}progress{width:100%}[hidden]{display:none!important}</style></head><body><h1>Video optimization check</h1><p>Test conversion on this device. This page does not upload or publish your video.</p><form><label for="file">Choose a clip up to 25 MB</label><br><input id="file" type="file" accept=".mp4,.mov,.webm" required><br><button id="optimize" type="submit">Optimize video</button> <button id="cancel" type="button" hidden>Cancel</button></form><p id="status" role="status" aria-live="polite">Choose a clip to begin.</p><progress id="progress" max="100" hidden></progress><video id="preview" controls playsinline hidden></video><script type="module">
import{optimizeVideo}from'../scripts/video-optimizer.mjs?v=20261030-web2';
let controller,previewURL;const $=id=>document.getElementById(id);
$('cancel').onclick=()=>controller?.abort();
document.querySelector('form').onsubmit=async event=>{event.preventDefault();controller=new AbortController();$('optimize').disabled=true;$('cancel').hidden=false;$('progress').hidden=false;$('preview').hidden=true;try{const file=await optimizeVideo($('file').files[0],{signal:controller.signal,onProgress:({phase,percent})=>{$('status').textContent=phase+(Number.isFinite(percent)?' '+percent+'%':'');if(Number.isFinite(percent))$('progress').value=percent;else $('progress').removeAttribute('value');}});if(previewURL)URL.revokeObjectURL(previewURL);previewURL=URL.createObjectURL(file);$('preview').src=previewURL;$('preview').hidden=false;$('status').textContent='Optimization complete: '+(file.size/1024/1024).toFixed(2)+' MB, MP4. Nothing uploaded.';}catch(error){$('status').textContent=error.message;}finally{$('optimize').disabled=false;$('cancel').hidden=true;$('progress').hidden=true;}};
</script></body></html>
