<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NJ Hitz Coaching Staff | Our Coaching Team</title>
  <meta name="description" content="Meet the NJ Hitz Softball coaching staff and leadership — experienced coaches focused on player development, softball IQ, and a strong team-first culture." />
  <meta name="image" content="https://njhitz.org/images/hitz-meta-og.png" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://njhitz.org/coaches" />
  <meta property="og:title" content="NJ Hitz Coaching Staff" />
  <meta property="og:description" content="Get to know the NJ Hitz Softball coaching staff, their experience, and the teams they lead." />
  <meta property="og:image" content="https://njhitz.org/images/hitz-meta-og.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="NJ Hitz Coaching Staff" />
  <meta name="twitter:description" content="Meet the coaches behind NJ Hitz Softball — leadership, championship experience, and player-first development." />
  <meta name="twitter:image" content="https://njhitz.org/images/hitz-meta-og.png" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SportsTeam",
    "name": "NJ Hitz Softball",
    "url": "https://njhitz.org/coaches",
    "sport": "Softball",
    "logo": "https://njhitz.org/images/hitz-meta-square.png"
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <script src="scripts/preload.js"></script>

  <link href="css/main.css" rel="stylesheet" />

  <style>
    /* Show hero eyebrow on this page */
    .hero-eyebrow {
      display: block;
    }

    main {
      flex: 1;
      padding: 26px 16px 40px;
    }

    .content {
      max-width: 1100px;
      margin: 0 auto;
    }

    .page-intro {
      margin-bottom: 18px;
      font-size: .98rem;
      color: #d7d7e2;
    }

    /* Jump nav for coaches */
    .coach-jump {
      background: #141418;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.08);
      padding: 12px 12px 10px;
      margin-bottom: 24px;
    }
    .coach-jump-label {
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: #bfbfd1;
      margin: 0 0 8px;
    }
    .coach-jump-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .coach-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #1a1a22;
      border: 1px solid rgba(255,255,255,.16);
      font-size: .85rem;
      text-decoration: none;
      white-space: nowrap;
      transition: background .18s ease, transform .18s ease, border-color .18s ease;
    }
    .coach-chip span {
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: #c8c8da;
    }
    .coach-chip:hover {
      background: radial-gradient(120% 140% at 100% 0, rgba(179,139,53,.24), #1a1a22 50%);
      border-color: rgba(255,255,255,.32);
      transform: translateY(-1px);
    }

    /* Sections */
    .coach-section {
      margin-top: 28px;
    }
    .coach-section:first-of-type {
      margin-top: 0;
    }
    .coach-section h2 {
      margin: 0 0 4px;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: .16em;
      color: var(--hitz-gold);
    }
    .coach-section p.section-lead {
      margin: 0 0 14px;
      font-size: .95rem;
      color: #d7d7e2;
    }

    .coach-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    @media (min-width: 720px) {
      .coach-grid {
        gap: 18px;
      }
    }

    /* Coach cards (built off team-card styling) */
    .coach-card {
      background: radial-gradient(120% 140% at 100% 0, rgba(179,139,53,.14), transparent 55%), #141418;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.08);
      padding: 14px 14px 16px;
      box-shadow: 0 10px 24px rgba(0,0,0,.45);
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px;
      align-items: flex-start;
      scroll-margin-top: 96px; /* so anchors from other pages land nicely below header */
    }
    @media (min-width: 720px) {
      .coach-card {
        padding: 16px 18px 18px;
        gap: 16px;
      }
    }
    @media (max-width: 640px) {
      .coach-card {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .coach-photo-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      min-width:175px;
    }
    .coach-photo {
      width: 150px;
      height: 150px;
      border-radius: 14px;
      background: #111119;
      border: 1px solid rgba(255,255,255,.18);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: #bcbcd4;
    }
    .coach-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .coach-role-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .13em;
      color: #e4e4f7;
      background: #101018;
    }

    .coach-body {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: .94rem;
    }
    .coach-header-line {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 10px;
    }
    .coach-name {
      font-weight: 800;
      font-size: 1.02rem;
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    .coach-role {
      font-size: .9rem;
      color: #e0e0f2;
    }
    .coach-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
      font-size: .8rem;
    }
    .coach-meta-pill {
      padding: 3px 8px;
      border-radius: 999px;
      background: #1a1a22;
      border: 1px solid rgba(255,255,255,.14);
      text-transform: uppercase;
      letter-spacing: .11em;
      color: #c7c7d6;
    }
    .coach-bio {
      margin-top: 6px;
      color: #e3e3fa;
      line-height: 1.5;
      font-size: .92rem;
    }
    .coach-highlights {
      margin: 6px 0 0;
      padding-left: 18px;
      font-size: .9rem;
      color: #d4d4eb;
    }
    .coach-highlights li {
      margin-bottom: 3px;
    }
    .coach-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
      font-size: .8rem;
    }
    .coach-tag {
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.16);
      background: #101018;
      color: #d9d9f0;
    }

    @media (prefers-reduced-motion: reduce) {
      .coach-chip {
        transition: none;
      }
    }
  </style>
</head>

<body>
    <!-- Shared site header -->
    <header class="site-header" id="header"></header>

    <div class="page-container">
        <section class="hero">
        <div class="hero-inner">
            <!-- <div class="hero-eyebrow">NJ HITZ SOFTBALL</div> -->
            <h1>Coaching Staff & Leadership</h1>
            <p>
            Meet the coaches behind NJ Hitz Softball — program leadership and team staff
            with experience at the travel, high school, and college levels, all committed
            to development, culture, and a team-first mindset.
            </p>
        </div>
        </section>

        <main>
            <div class="content" id="staffContent">
            <!-- Coaching sections & cards injected from data/staff.json via staff.js -->
            </div>
        </main>

        <div id="footer"></div>
    </div>

    <script src="scripts/template-loader.js"></script>
    <script src="scripts/staff.js"></script>
</body>
</html>
